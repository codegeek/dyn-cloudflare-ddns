[tool.poetry]
name = "dyn-cloudflare-ddns"
version = "0.1.1"
description = "Update Cloudflare DNS from a dynamic DNS record"
authors = ["Guillermo Castro <admin@codegeek.dev>"]
packages = [
    { include = "dyn-cloudflare-ddns" }
]

[tool.poetry.dependencies]
python = "^3.10"
# Cloudflare 3+ requires migrating the legacy CloudFlare client API.
cloudflare = "^2.20.0"
dnspython = "^2.8.0"
requests = "^2.34.2"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
